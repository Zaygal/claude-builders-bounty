name: claude-review

# Reviews every new / updated pull request and posts a structured comment.
#
# Required repository secrets:
#   LLM_BASE_URL - OpenAI-compatible endpoint (e.g. https://api.deepseek.com/v1)
#   LLM_API_KEY  - key for that endpoint
# Optional:
#   LLM_MODEL    - model name (default: deepseek-chat)
#
# To use Anthropic instead, drop LLM_* and set ANTHROPIC_API_KEY.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run claude-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python3 claude-review.py \
            --pr "${{ github.event.pull_request.html_url }}" \
            --backend openai \
            --post
